<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RadianceJS Example</title>
  </head>
  <body>
    <style>
      #renders {
        position: absolute;
        left: 1em;
        bottom: 1em;
        font-family: sans-serif;
        font-size: 1.5rem;
      }

      .canvas-container {
        position: relative;
        width: min(90svmin, 900px);
        aspect-ratio: 1;
      }

      .canvas-container canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #playPause {
        position: absolute;
        right: 0.5em;
        bottom: 0.5em;
        display: grid;
        place-items: center;
        background: rgb(128 128 128 / 0.1);
        width: 2.4em;
        height: 2.4em;
        font-size: 1.5rem;
        border-radius: 8px;
        border: 1px solid rgb(128 128 128 / 0.4);
        cursor: pointer;

        &:hover {
          background: rgb(128 128 128 / 0.2);
        }

        &:active {
          background: rgb(128 128 128 / 0.1);
        }
      }

      #playPause svg {
        width: 1.5em;
        height: 1.5em;
        fill: currentColor;
      }

      #playPause .icon-pause {
        display: none;
      }

      #playPause.playing .icon-play {
        display: none;
      }

      #playPause.playing .icon-pause {
        display: block;
      }
    </style>
    <div class="canvas-container">
      <canvas id="glCanvas"></canvas>
      <button id="playPause" type="button" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
        </svg>
      </button>
    </div>
    <div id="renders">Renders: <strong id="renderCount">0</strong></div>
    <script src="/index.ts"></script>
  </body>
</html>
