name: Size

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  PNPM_VERSION: 11.7.0
  NODE_VERSION: lts/*

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore base size report
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/size-report
          key: bundle-size-${{ github.event.pull_request.base.sha }}

      - name: Preserve base size report
        if: github.event_name == 'pull_request'
        run: |
          if [ -f "${RUNNER_TEMP}/size-report/report.json" ]; then
            mkdir -p "${RUNNER_TEMP}/base-size-report"
            cp "${RUNNER_TEMP}/size-report/report.json" "${RUNNER_TEMP}/base-size-report/report.json"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter="./lib" build:lib

      - name: Create glCanvas entry
        env:
          CONSUMER_ENTRY: ${{ runner.temp }}/glcanvas-entry.ts
          LIBRARY_ENTRY: ${{ github.workspace }}/lib/dist/index.js
        run: node .github/scripts/create-glcanvas-entry.mts

      - name: Measure gzip sizes
        id: measure
        env:
          CONSUMER_ENTRY: ${{ runner.temp }}/glcanvas-entry.ts
          REPORT_DIR: ${{ runner.temp }}/size-report
        run: pnpm --filter="./lib" exec node ../.github/scripts/measure-size.mts

      - name: Save main size report
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/size-report
          key: bundle-size-${{ github.sha }}

      - name: Update pull request comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPORT: ${{ runner.temp }}/size-report/report.json
          BASE_REPORT: ${{ runner.temp }}/base-size-report/report.json
        run: node .github/scripts/update-size-comment.mts
